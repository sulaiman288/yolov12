nc: 4
scales:
  n: [0.50, 0.25, 1024]
  #x: [1.00, 1.50, 512]


backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]                # 0-P1/2a
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]         # 1-P2/4
  #- [-1, 2, GTDRC3, [256, True]]              # 2-P2/4 - Replaced with GTDRC3
  - [-1, 2, C3k2,  [256, False, 0.25]]        # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]         # 3-P3/8
  # - [-1, 2, GTDRC3, [512, True]]              # 4  backbone P3 - Replaced with GTDRC3
  - [-1, 2, C3k2,  [512, False, 0.25]]        # 4  backbone P3
  - [-1, 1, Conv,  [512, 3, 2]]               # 5-P4/16
  # - [-1, 4, GTDRC3, [512, True]]              # 6 backbone P4 - Replaced with GTDRC3
  - [-1, 4, A2C2f, [512, True, 4]]            # 6  backbone P4
  - [-1, 1, Conv,  [1024, 3, 2]]              # 7-P5/32
  # - [-1, 4, GTDRC3, [1024, True]]             # 8 backbone P5 - Replaced with GTDRC3
  - [-1, 4, A2C2f, [1024, True, 1]]           # 8  backbone P5


head:
  # Side parallel fusion
  - [[4, 6], 1, HARFM, [256]]                 # 9   refined low-side feature
  - [[6, 8], 1, HARFM, [512]]                 # 10  refined high-side feature

  # Central tri-scale fusion hub (P4-sized output)
  #- [[9, 6, 10], 1, FFAM, [512]]              # 11  fused_mid
  - [[9, 6, 10], 1, FFAM, [512, True, [5, 7, 9, 11]]]  # 11 fused_mid


  # P3 branch
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 9], 1, Concat, [1]]                  # 13
  - [-1, 2, A2C2f, [256, False, -1]]          # 14  P3 out
  #- [-1, 2, GTDRC3, [256, True]]               # 14  Replacement of the A2C2f block with GTDRC3 for P3 out

  # P4 branch
  - [11, 2, A2C2f, [512, False, -1]]          # 15  P4 out
  #- [11, 2, GTDRC3, [512, True]] # 17         # Replacement of the A2C2f block with GTDRC3 for P4 out

  # P5 branch
  - [11, 1, Conv, [512, 3, 2]]                # 16
  - [[-1, 8], 1, Concat, [1]]                 # 17
  - [-1, 2, C3k2, [1024, True]]               # 18  P5 out

  # Detect
  - [[14, 15, 18], 1, Detect, [nc]]

