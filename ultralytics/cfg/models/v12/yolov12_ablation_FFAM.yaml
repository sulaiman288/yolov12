nc: 80
scales:
  n: [0.50, 0.25, 1024]
  #x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]                # 0-P1/2a
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]         # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]        # 2
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]         # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]        # 4  backbone P3
  - [-1, 1, Conv,  [512, 3, 2]]               # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]            # 6  backbone P4
  - [-1, 1, Conv,  [1024, 3, 2]]              # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]           # 8  backbone P5


head:
  # FFAM-only central tri-scale fusion hub
  - [[4, 6, 8], 1, FFAM, [512, True, [5, 7, 9, 11]]]  # 9 fused_mid

  # P3 branch
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]        # 10
  - [[-1, 4], 1, Concat, [1]]                         # 11
  - [-1, 2, A2C2f, [256, False, -1]]                  # 12 P3 out

  # P4 branch
  - [9, 2, A2C2f, [512, False, -1]]                   # 13 P4 out

  # P5 branch
  - [9, 1, Conv, [512, 3, 2]]                         # 14
  - [[-1, 8], 1, Concat, [1]]                         # 15
  - [-1, 2, C3k2, [1024, True]]                       # 16 P5 out

  # Detect
  - [[12, 13, 16], 1, Detect, [nc]]

