nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4 backbone P3
  - [-1, 1, Conv, [512, 3, 2]]                # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]            # 6 backbone P4
  - [-1, 1, Conv, [1024, 3, 2]]               # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]           # 8 backbone P5

head:
  # Stage 1: bottom-up assist + first FFAM
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]                    # 9
  - [[-1, 6], 1, Concat, [1]]                                    # 10
  - [[4, 6, 10], 1, FFAM, [512, True, [5, 7, 9, 11]]]           # 11 first FFAM (P4 hub)

  # Stage-1 upper branch
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]                   # 12
  - [[-1, 4], 1, Concat, [1]]                                    # 13
  - [-1, 2, A2C2f, [256, False, -1]]                             # 14 P3_s1

  # Stage 2: two HARFM side refinements + second FFAM
  - [[14, 11], 1, HARFM, [256]]                                  # 15 upper HARFM (P3 size)
  - [[11, 8], 1, HARFM, [512]]                                   # 16 lower HARFM (P4 size)

  - [[15, 11, 16], 1, FFAM, [512, True, [5, 7, 9, 11]]]         # 17 second FFAM (final P4)

  # Final P3 branch
  - [17, 1, nn.Upsample, [None, 2, "nearest"]]                   # 18
  - [[-1, 15], 1, Concat, [1]]                                   # 19
  - [-1, 2, A2C2f, [256, False, -1]]                             # 20 final P3

  # Final P5 branch
  - [17, 1, Conv, [512, 3, 2]]                                   # 21
  - [[-1, 8], 1, Concat, [1]]                                    # 22
  - [-1, 2, C3k2, [1024, True]]                                  # 23 final P5

  # Detect
  - [[20, 17, 23], 1, Detect, [nc]]