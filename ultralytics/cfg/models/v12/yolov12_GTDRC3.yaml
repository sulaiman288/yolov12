# YOLOv12 with GTDRC3 blocks
# Example configuration demonstrating GTDRC3 module usage

nc: 80  # number of classes
scales:
  n: [0.50, 0.25, 1024]
  #x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]        # 1-P2/4
  - [-1, 2, GTDRC3, [256, True]]            # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]        # 3-P3/8
  - [-1, 2, GTDRC3, [512, True]]            # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]              # 5-P4/16
  - [-1, 4, GTDRC3, [512, True]]            # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]             # 7-P5/32
  - [-1, 4, GTDRC3, [1024, True]]           # 8-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]               # cat backbone P4
  - [-1, 2, GTDRC3, [512, True]]            # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]               # cat backbone P3
  - [-1, 2, GTDRC3, [256, True]]            # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]              # cat head P4
  - [-1, 2, GTDRC3, [512, True]]            # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]               # cat head P5
  - [-1, 2, GTDRC3, [1024, True]]           # 20 (P5/32-large)

  - [[14, 17, 20], 1, Detect, [nc]]        # Detect(P3, P4, P5)
